include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/l10n/generated/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - directives_ordering
    - sort_child_properties_last
    - use_super_parameters
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
