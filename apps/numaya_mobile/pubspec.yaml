name: numaya_mobile
description: "Numaya: native mobile app (Flutter)."
publish_to: 'none'

# version: <marketing name>+<build number>. Bump the build number for every store upload.
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management: Notifier view models and dependency injection (see docs/mobile/TECH_STACK.md).
  flutter_riverpod: ^3.4.3
  # Declarative routing with redirects (onboarding guard).
  go_router: ^18.1.1
  # Renders the design system's icons and illustrations, exported from the web as SVG.
  flutter_svg: ^2.3.0
  # Pinned by flutter_localizations.
  intl: ^0.20.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/illustrations/
    # Mobile-only scenes in the same style (not part of the web export); see docs/mobile/ILLUSTRATION_BACKLOG.md.
    - assets/illustrations/mobile/
    # Sample media for the demo chat attachments (fictional, generated for this repo).
    - assets/demo/

  # Monochrome Meetup type: one rounded geometric family, Figtree (variable, wght 300-900), from
  # github.com/google/fonts (ofl/figtree). Licence: assets/fonts/OFL-Figtree.txt (SIL OFL 1.1).
  # The baseline's Hanken Grotesk file stays in assets/fonts/ (unregistered) for comparison.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
