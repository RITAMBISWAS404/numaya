name: numaya_mobile
description: "Numaya: native mobile app (Flutter)."
publish_to: 'none'

# version: <marketing name>+<build number>. Bump the build number for every store upload.
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management: Notifier view models and dependency injection (see docs/mobile/TECH_STACK.md).
  flutter_riverpod: ^3.4.3
  # Declarative routing with redirects (onboarding guard).
  go_router: ^18.1.1
  # Renders the design system's icons and illustrations, exported from the web as SVG.
  flutter_svg: ^2.3.0
  # Pinned by flutter_localizations.
  intl: ^0.20.2
  image_picker: ^1.2.4
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  accessibility_tools: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/illustrations/
    # Mobile-only scenes in the same style (not part of the web export); see docs/mobile/ILLUSTRATION_BACKLOG.md.
    - assets/illustrations/mobile/
    # Sample media for the demo chat attachments (fictional, generated for this repo).
    - assets/demo/
    # Local reference photos for the demo UI: git-ignored, installed per machine by
    # tool/install_demo_photos.py (assets/demo/photos/README.md). Only the README is committed.
    - assets/demo/photos/
    # Tabler Icons 3.50.0 (MIT, assets/icons/tabler/LICENSE): official SVGs, synced by
    # tool/sync_tabler_icons.py.
    - assets/icons/tabler/outline/
    - assets/icons/tabler/filled/

  # Monochrome Meetup type: one rounded geometric family, Figtree (variable, wght 300-900), from
  # github.com/google/fonts (ofl/figtree). Licence: assets/fonts/OFL-Figtree.txt (SIL OFL 1.1).
  # The baseline's Hanken Grotesk file stays in assets/fonts/ (unregistered) for comparison.
  fonts:
    # Editorial type comparison only (NUMAYA_EDITORIAL_TYPE; docs/v8-replacement/FONT_ASSET_INVENTORY.md).
    # google/fonts ofl/googlesans and ofl/breeserif, SIL OFL 1.1 (assets/fonts/OFL-GoogleSans.txt,
    # OFL-BreeSerif.txt). "Google Sans" is a Google trademark; the unmodified file keeps its name.
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Variable.ttf
    - family: Bree Serif
      fonts:
        - asset: assets/fonts/BreeSerif-Regular.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
    # Headings and metrics (OFL-1.1, assets/fonts/OFL-PlusJakartaSans.txt; google/fonts ofl/plusjakartasans).
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    # UI-085 typography comparison (review builds; Prototype tools > Typography). All SIL OFL 1.1
    # from github.com/google/fonts (ofl/fraunces, instrumentserif, dmserifdisplay, manrope,
    # poppins), licences beside each file. Instrument Serif and DM Serif Display ship one weight
    # (400) and are never synthetically emboldened; Poppins ships static 400/500/600/700.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
